# XcodeGen 설정 - `xcodegen generate` 가 MateToday.xcodeproj 를 만든다(저장소에는 올리지 않는다).
# 판을 올릴 때는 MARKETING_VERSION(보이는 판) · CURRENT_PROJECT_VERSION(빌드 번호)을 함께 올린다.
name: MateToday
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  MateToday:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MATE 오늘
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.devteammate.today
        CODE_SIGN_ENTITLEMENTS: App/MateToday.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MateTodayWidget
  MateTodayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MATE 오늘
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.devteammate.today.widget
        CODE_SIGN_ENTITLEMENTS: Widget/MateTodayWidget.entitlements
        SKIP_INSTALL: YES
schemes:
  MateToday:
    build:
      targets:
        MateToday: all
    run:
      config: Debug
    archive:
      config: Release
